<body>
  <div class="container">
    <h1>📊 Dashboard Data Medsos</h1>

    <div id="setupBanner" class="setup-banner" style="display:none;">
      ⚙️ <b>Setup:</b> Buka file <code>index.html</code>, cari baris
      <code>const APPS_SCRIPT_URL = '...'</code>, ganti dengan URL Web App
      Apps Script Anda yang diakhiri <code>/exec</code>.
      Deploy harus di-set <b>Who has access: Anyone</b>.
    </div>

    <div class="btn-group">
      <button id="btnRefresh" class="btn-secondary" onclick="runRefresh()">
        🔁 Refresh Data
      </button>
      <button id="btnImport" class="btn-primary" onclick="runImport()">
        ⚡ Update Data
      </button>
    </div>

    <div id="status" class="status"></div>

    <div id="tableWrap" class="table-wrap">
      <div class="table-header-bar">
        <span>Hasil Tabel</span>
        <span class="badge" id="tableBadge">0 baris</span>
      </div>
      <div id="filterBar" class="filter-bar"></div>
      <div class="table-scroll">
        <table id="resultTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <button id="toTopBtn" onclick="scrollToTop()" title="Kembali ke atas" aria-label="Kembali ke atas">👆</button>

  <script>
    /* ==========================================================
     * 🔧 KONFIGURASI — WAJIB DIISI
     * ========================================================== */
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwugzNTOR3qKxa0dpckkwf0ESQM8BhahPe8TjD6waBymcyvanhW9nSnr8XQLa5lnxDQ/exec';
    // ==========================================================

    /* ====== Breakpoint mobile/tablet ====== */
    const MOBILE_BREAKPOINT = 900;
    function isNarrowView() {
      return window.innerWidth <= MOBILE_BREAKPOINT;
    }
    function visibleColumnCount(total) {
      return isNarrowView() ? Math.min(2, total) : total;
    }

    /* ====== State ====== */
    let currentTable = null;
    let sortState    = { colIdx: null, dir: 'asc' };
    let filterState  = {};

    /* ====== Elemen ====== */
    const btnImport   = document.getElementById('btnImport');
    const btnRefresh  = document.getElementById('btnRefresh');
    const statusEl    = document.getElementById('status');
    const tableWrap   = document.getElementById('tableWrap');
    const tableHead   = document.getElementById('tableHead');
    const tableBody   = document.getElementById('tableBody');
    const tableBadge  = document.getElementById('tableBadge');
    const filterBar   = document.getElementById('filterBar');
    const toTopBtn    = document.getElementById('toTopBtn');
    const setupBanner = document.getElementById('setupBanner');

    /* ====== Cek URL config ====== */
    (function checkConfig() {
      const url = (APPS_SCRIPT_URL || '').trim();
      if (!url || url.indexOf('http') !== 0) {
        setupBanner.style.display = 'block';
        showStatus('error', '❌ URL Apps Script belum diisi. Lihat petunjuk di atas.');
      }
    })();

    /* ====== JSONP helper ====== */
    function jsonpRequest(action, extraParams) {
      return new Promise((resolve, reject) => {
        const urlStr = (APPS_SCRIPT_URL || '').trim();
        if (!urlStr || urlStr.indexOf('http') !== 0) {
          return reject(new Error('URL Apps Script belum diisi.'));
        }

        const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Request timeout (30 detik). Periksa koneksi & deploy.'));
        }, 30000);

        let script;

        function cleanup() {
          clearTimeout(timeout);
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
          if (script && script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          resolve(data);
        };

        const params = Object.assign({}, extraParams || {}, {
          action: action,
          callback: cbName,
          _t: Date.now()
        });

        const sep = urlStr.indexOf('?') === -1 ? '?' : '&';
        const query = Object.keys(params)
          .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
          .join('&');

        script = document.createElement('script');
        script.src = urlStr + sep + query;
        script.async = true;
        script.onerror = function() {
          cleanup();
          reject(new Error('Gagal memuat endpoint. Periksa URL & pastikan deploy "Anyone".'));
        };
        document.body.appendChild(script);
      });
    }

    /* ====== Util ====== */
    function setLoading(btn, isLoading) {
      if (isLoading) {
        btn.disabled = true;
        btn.dataset.original = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span> Memproses...';
      } else {
        btn.disabled = false;
        if (btn.dataset.original) btn.innerHTML = btn.dataset.original;
      }
    }
    function showStatus(type, msg) {
      statusEl.className = 'status show ' + type;
      statusEl.innerHTML = msg;
    }
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ====== Render ====== */
    function renderTable(table) {
      currentTable = table;
      sortState    = { colIdx: null, dir: 'asc' };
      filterState  = {};
      (table.filters || []).forEach(f => { filterState[f.key] = ''; });

      renderHeader();
      renderFilterBar();
      applyFilterAndSort();
      tableWrap.classList.add('show');
    }

    function renderHeader() {
      const t = currentTable;
      if (!t || !t.headers || t.headers.length === 0) {
        tableHead.innerHTML = '';
        return;
      }
      const maxCols = visibleColumnCount(t.headers.length);

      let html = '<tr>';
      for (let i = 0; i < maxCols; i++) {
        const h = t.headers[i];
        const isSorted = sortState.colIdx === i;
        const icon = isSorted ? (sortState.dir === 'asc' ? '▲' : '▼') : '⇅';
        html += `<th class="${isSorted ? 'sorted' : ''}"
                     onclick="toggleSort(${i})"
                     title="Klik untuk urutkan">
                   ${escapeHtml(h)}
                   <span class="sort-icon">${icon}</span>
                 </th>`;
      }
      // kolom "info" kecil untuk indikator di mobile
      if (isNarrowView() && t.headers.length > maxCols) {
        html += `<th style="width:34px;text-align:center;cursor:default;" title="Ketuk baris untuk detail">⋯</th>`;
      }
      html += '</tr>';
      tableHead.innerHTML = html;
    }

    function toggleSort(colIdx) {
      if (sortState.colIdx === colIdx) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.colIdx = colIdx;
        sortState.dir = 'asc';
      }
      renderHeader();
      applyFilterAndSort();
    }

    function renderFilterBar() {
      const t = currentTable;
      const filters = t.filters || [];
      if (filters.length === 0) {
        filterBar.innerHTML = '';
        filterBar.style.display = 'none';
        return;
      }
      filterBar.style.display = 'flex';

      const items = filters.map(f => {
        const opts = (t.filterOptions[f.key] || []).map(v =>
          `<option value="${escapeHtml(v)}">${escapeHtml(v === '' ? '(kosong)' : v)}</option>`
        ).join('');
        return `
          <div class="filter-item">
            <label>${escapeHtml(f.name)}</label>
            <select data-key="${f.key}" onchange="onFilterChange(this)">
              <option value="">Semua</option>
              ${opts}
            </select>
          </div>`;
      }).join('');

      filterBar.innerHTML = items +
        `<button class="btn-reset" onclick="clearAllFilters()">🧹 Reset Filter</button>`;
    }

    function onFilterChange(sel) {
      const key = parseInt(sel.dataset.key, 10);
      filterState[key] = sel.value;
      applyFilterAndSort();
    }

    function clearAllFilters() {
      Object.keys(filterState).forEach(k => { filterState[k] = ''; });
      filterBar.querySelectorAll('select').forEach(s => { s.value = ''; });
      applyFilterAndSort();
    }

    function applyFilterAndSort() {
      const t = currentTable;
      if (!t) return;

      let rows = t.rows.slice();

      Object.keys(filterState).forEach(k => {
        const key = parseInt(k, 10);
        const val = filterState[k];
        if (val !== '' && val !== null && val !== undefined) {
          rows = rows.filter(r => (r.f && r.f[key] !== undefined ? r.f[key] : '') === val);
        }
      });

      if (sortState.colIdx !== null) {
        const dir = sortState.dir === 'asc' ? 1 : -1;
        const ci = sortState.colIdx;
        rows.sort((a, b) => compareValues(a.d[ci], b.d[ci]) * dir);
      }

      renderBody(rows);
    }

    function compareValues(a, b) {
      const sa = String(a ?? '').trim();
      const sb = String(b ?? '').trim();
      const na = parseFloat(sa.replace(',', '.'));
      const nb = parseFloat(sb.replace(',', '.'));
      const aIsNum = sa !== '' && !isNaN(na) && isFinite(na);
      const bIsNum = sb !== '' && !isNaN(nb) && isFinite(nb);
      if (aIsNum && bIsNum) return na - nb;
      return sa.localeCompare(sb, 'id', { numeric: true, sensitivity: 'base' });
    }

    function renderBody(rows) {
      const t = currentTable;
      if (!rows || rows.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="${visibleColumnCount(t.headers.length)}" class="empty-msg">
          Tidak ada data yang cocok.
        </td></tr>`;
        tableBadge.textContent = '0 baris · ' + t.headers.length + ' kolom';
        return;
      }

      const maxCols = visibleColumnCount(t.headers.length);
      const hasMore = isNarrowView() && t.headers.length > maxCols;

      tableBody.innerHTML = rows.map(r => {
        let cells = '';
        for (let i = 0; i < maxCols; i++) {
          cells += `<td>${escapeHtml(r.d[i])}</td>`;
        }
        if (hasMore) {
          cells += `<td style="text-align:center;color:#9aa8c7;font-size:14px;">›</td>`;
        }
        return `<tr class="clickable">${cells}</tr>`;
      }).join('');

      // Simpan referensi data baris untuk aksi klik
      const trs = tableBody.querySelectorAll('tr.clickable');
      trs.forEach((tr, i) => { tr.__rowData = rows[i]; });

      tableBadge.textContent = rows.length + ' baris · ' + t.headers.length + ' kolom';
    }

    /* ====== Card Detail (Klik Baris) ====== */
    function buildDetailCardHtml(t, row) {
      const items = t.headers.map((h, i) => `
        <div class="detail-item">
          <span class="k">${escapeHtml(h)}</span>
          <span class="v">${escapeHtml(row.d[i] ?? '')}</span>
        </div>`).join('');

      return `
        <div class="detail-card">
          <div class="detail-title">
            <span>📄 Detail Data</span>
            <button type="button" class="detail-close">✕ Tutup</button>
          </div>
          <div class="detail-grid">${items}</div>
        </div>`;
    }

    function closeAllDetailRows() {
      tableBody.querySelectorAll('tr.detail-row').forEach(el => el.remove());
      tableBody.querySelectorAll('tr.row-active').forEach(el => el.classList.remove('row-active'));
    }

    function toggleDetailRow(tr) {
      const isActive = tr.classList.contains('row-active');

      // Selalu tutup semua card dulu → hanya 1 card yang tampil
      closeAllDetailRows();

      if (isActive) return; // klik baris yang sama = tutup

      const t = currentTable;
      if (!t || !tr.__rowData) return;

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      const td = document.createElement('td');
      td.colSpan = visibleColumnCount(t.headers.length) + ((isNarrowView() && t.headers.length > visibleColumnCount(t.headers.length)) ? 1 : 0);
      td.innerHTML = buildDetailCardHtml(t, tr.__rowData);
      detailTr.appendChild(td);

      tr.parentNode.insertBefore(detailTr, tr.nextSibling);
      tr.classList.add('row-active');
    }

    /* Delegasi klik pada tbody */
    tableBody.addEventListener('click', function(e) {
      // Tombol Tutup di card
      if (e.target.closest('.detail-close')) {
        closeAllDetailRows();
        return;
      }
      const tr = e.target.closest('tr');
      if (!tr) return;
      if (tr.classList.contains('detail-row')) return;
      if (!tr.classList.contains('clickable')) return;
      toggleDetailRow(tr);
    });

    /* ====== Handler Tombol ====== */
    function runImport() {
      setLoading(btnImport, true);
      showStatus('loading', '⏳ Mengambil data & memperbarui tabel...');

      jsonpRequest('import')
        .then(res => {
          setLoading(btnImport, false);
          if (res && res.success) {
            showStatus('success', res.message);
            renderTable(res.table);
          } else {
            showStatus('error', (res && res.message) || 'Gagal import.');
          }
        })
        .catch(err => {
          setLoading(btnImport, false);
          showStatus('error', '❌ ' + err.message);
        });
    }

    function runRefresh() {
      setLoading(btnRefresh, true);
      showStatus('loading', '⏳ Memuat ulang tabel...');

      jsonpRequest('refresh')
        .then(res => {
          setLoading(btnRefresh, false);
          if (res && res.success) {
            showStatus('success', res.message);
            renderTable(res.table);
          } else {
            showStatus('error', (res && res.message) || 'Refresh gagal.');
          }
        })
        .catch(err => {
          setLoading(btnRefresh, false);
          showStatus('error', '❌ ' + err.message);
        });
    }

    /* ====== Tombol To The Top ====== */
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (!('scrollBehavior' in document.documentElement.style)) {
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }
    }
    window.addEventListener('scroll', () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      if (y > 300) toTopBtn.classList.add('show');
      else         toTopBtn.classList.remove('show');
    }, { passive: true });

    /* ====== Re-render saat resize melewati breakpoint ====== */
    let lastNarrow = isNarrowView();
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const nowNarrow = isNarrowView();
        if (nowNarrow !== lastNarrow) {
          lastNarrow = nowNarrow;
          if (currentTable) {
            renderHeader();
            applyFilterAndSort();
          }
        }
      }, 180);
    });
  </script>
</body>
</html>
